<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>領収書へのサイン</title>
<style>
:root{--bg:#f2f0ec;--paper:#fff;--ink:#1a1a1a;--sub:#666;--line:#bbb;--accent:#1a1a1a;--err:#c62828;--ok:#1a7f37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.paper{background:var(--paper);border-radius:10px;padding:20px 18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{text-align:center;font-family:"Hiragino Mincho ProN",serif;letter-spacing:.5em;font-size:24px;margin:0 0 14px;padding-left:.5em}
.payee{font-size:17px;border-bottom:1px solid var(--ink);padding-bottom:4px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.payee small{font-size:13px;color:var(--sub);white-space:nowrap}
.amount{border:2px solid var(--ink);margin:16px 0 12px;padding:10px 14px;display:flex;align-items:baseline;gap:14px}
.amount span{font-size:13px}
.amount b{font-family:"Hiragino Mincho ProN",serif;font-size:28px}
.prov{font-size:14px;margin:0}
.lbl{font-size:12px;color:var(--sub);margin:16px 0 2px}
input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
#sigbox{width:100%;height:130px;margin-top:4px;border:2px dashed #888;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:#777;font-size:16px;font-weight:700;padding:6px}
#sigbox img{max-width:100%;max-height:100%}
#pad{position:fixed;inset:0;z-index:10;background:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#pad.hide{display:none}
/* 縦持ちのときは書く画面ごと 90 度回して横向きで出す(iPhone は向きの固定ができないため) */
#pad.rot{inset:auto;top:0;left:0;transform-origin:top left;padding:env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left) env(safe-area-inset-top)}
#pad .bar{padding:10px 14px;font-size:14px;color:#444;text-align:center}
#pad .area{flex:1;position:relative;margin:0 10px;border:2px dashed #aaa;border-radius:12px;min-height:0}
#pad .area::after{content:"";position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1px solid #ccc;pointer-events:none}
#pad .area span{position:absolute;left:8%;bottom:calc(28% + 4px);color:#bbb;font-size:22px;pointer-events:none}
#big{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#pad .btns{display:flex;gap:8px;padding:10px}
#pad .btns button{flex:1;padding:12px 4px;font-size:15px;white-space:nowrap}
.row{display:flex;gap:10px;margin-top:8px}
button{font:inherit;font-weight:700;border-radius:10px;padding:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
button.main{background:var(--accent);color:#fff;width:100%;font-size:18px;margin-top:20px}
button:disabled{opacity:.5}
.err{color:var(--err);font-weight:700;margin-top:10px;white-space:pre-wrap}
.note{font-size:12px;color:var(--sub);margin-top:14px}
.done{text-align:center;padding:40px 10px}
.done .mark{font-size:54px;color:var(--ok);line-height:1}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:14px;border:2px solid var(--accent);color:var(--accent);margin-top:20px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <div id="loading" class="paper">読み込み中…</div>
  <div id="fail" class="paper hide"><p class="err" id="failmsg"></p></div>

  <form id="form" class="paper hide" autocomplete="on">
    <h1>領収書</h1>
    <div class="payee"><span id="payee"></span><small id="date"></small></div>
    <div class="amount"><span>金額</span><b id="amount"></b></div>
    <p class="prov">但し、<span id="prov"></span><br>上記、正に領収いたしました。</p>

    <div class="lbl">ご住所(必須)</div><input id="address" name="address" autocomplete="street-address" required>
    <div class="lbl">お名前(必須)</div><input id="name" name="name" autocomplete="name" required>
    <div class="lbl">お電話番号</div><input id="phone" name="phone" type="tel" autocomplete="tel">

    <div class="lbl">サイン</div>
    <button type="button" id="sigbox">タップしてサインを書く ✍︎</button>

    <button class="main" id="send" type="submit">この内容で送信する</button>
    <div class="err" id="err"></div>
    <p class="note">空いているところは書いて、違っていたら直してから送信してください。送信すると金額・内容は変えられません。</p>
  </form>

  <div id="done" class="paper done hide">
    <div class="mark">✓</div>
    <h2>送信しました</h2>
    <p>ありがとうございました。</p>
    <a class="btn" id="copy" target="_blank" rel="noopener">控えの PDF を保存</a>
    <p class="note">控えのリンクは 1 時間で切れます。</p>
  </div>
</main>
<div id="pad" class="hide">
  <div class="bar">スマホを横に持って、枠いっぱいに大きくサインしてください。</div>
  <div class="area"><canvas id="big"></canvas><span>✕</span></div>
  <div class="btns"><button type="button" id="padClear">書き直す</button><button type="button" id="padCancel">やめる</button><button type="button" class="main" id="padOk" style="margin:0">これで決定</button></div>
</div>
<script src="../config.js"></script>
<script src="../receipt-draw.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const token = location.hash.slice(1);
let receipt;

function show(id) { for (const k of ["loading", "fail", "form", "done"]) $(k).classList.toggle("hide", k !== id); }
function fail(msg) { $("failmsg").textContent = msg; show("fail"); }

async function api(method, path, body) {
  const res = await fetch(window.RECEIPT_API + path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `エラー(${res.status})`);
  return json;
}

// --- サイン欄: 枠をタップすると画面いっぱいの書く画面を開く ---
const big = $("big");
const bctx = big.getContext("2d");
let strokes = [], cur = null, sigImage = null; // strokes = [{w, h, pts: [[x, y], ...]}](書いたときの枠の大きさで記録)
let padW = 0, padH = 0;
function layoutPad() {
  const pad = $("pad"), W = window.innerWidth, H = window.innerHeight;
  const rot = H > W;
  pad.classList.toggle("rot", rot);
  pad.style.width = rot ? `${H}px` : ""; pad.style.height = rot ? `${W}px` : "";
  pad.style.transform = rot ? `translateX(${W}px) rotate(90deg)` : "";
}
function sizePad() {
  layoutPad();
  const dpr = window.devicePixelRatio || 1, r = { width: big.offsetWidth, height: big.offsetHeight }; // 回転前の大きさ
  if (r.width === padW && r.height === padH) return; // 向きが変わったときだけ描き直す
  padW = r.width; padH = r.height;
  big.width = Math.round(r.width * dpr); big.height = Math.round(r.height * dpr);
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw() {
  bctx.clearRect(0, 0, padW, padH);
  bctx.lineCap = "round"; bctx.lineJoin = "round"; bctx.strokeStyle = "#111"; bctx.lineWidth = 3.2;
  for (const st of strokes) {
    const k = Math.min(padW / st.w, padH / st.h);
    bctx.beginPath();
    st.pts.forEach(([x, y], i) => (i ? bctx.lineTo(x * k, y * k) : bctx.moveTo(x * k, y * k)));
    if (st.pts.length === 1) bctx.lineTo(st.pts[0][0] * k + 0.1, st.pts[0][1] * k + 0.1);
    bctx.stroke();
  }
}
function pos(e) {
  const r = big.getBoundingClientRect();
  // 90 度回しているときは画面の座標を枠の中の座標に戻す
  return $("pad").classList.contains("rot") ? [e.clientY - r.top, r.right - e.clientX] : [e.clientX - r.left, e.clientY - r.top];
}
big.addEventListener("pointerdown", (e) => { e.preventDefault(); big.setPointerCapture(e.pointerId); cur = { w: padW, h: padH, pts: [pos(e)] }; strokes.push(cur); redraw(); });
big.addEventListener("pointermove", (e) => { if (!cur) return; e.preventDefault(); cur.pts.push(pos(e)); redraw(); });
for (const ev of ["pointerup", "pointercancel"]) big.addEventListener(ev, () => { cur = null; });

let saved = [];
function openPad() {
  saved = strokes.slice();
  $("pad").classList.remove("hide"); document.body.style.overflow = "hidden";
  padW = padH = 0; sizePad();
}
function closePad() { $("pad").classList.add("hide"); document.body.style.overflow = ""; }
// 書いた部分だけを切り出す(領収書に大きく載せるため)
function trimmed() {
  const dpr = window.devicePixelRatio || 1, pad = 12;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const st of strokes) {
    const k = Math.min(padW / st.w, padH / st.h);
    for (const [x, y] of st.pts) { x0 = Math.min(x0, x * k); y0 = Math.min(y0, y * k); x1 = Math.max(x1, x * k); y1 = Math.max(y1, y * k); }
  }
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(padW, x1 + pad); y1 = Math.min(padH, y1 + pad);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round((x1 - x0) * dpr)); c.height = Math.max(1, Math.round((y1 - y0) * dpr));
  c.getContext("2d").drawImage(big, x0 * dpr, y0 * dpr, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}
$("sigbox").onclick = openPad;
$("padClear").onclick = () => { strokes = []; redraw(); };
$("padCancel").onclick = () => { strokes = saved; closePad(); };
$("padOk").onclick = () => {
  if (!strokes.length) { strokes = []; sigImage = null; $("sigbox").textContent = "タップしてサインを書く ✍︎"; return closePad(); }
  sigImage = trimmed();
  $("sigbox").innerHTML = "";
  const im = new Image(); im.src = sigImage.toDataURL(); im.alt = "サイン";
  $("sigbox").append(im);
  closePad();
};
window.addEventListener("resize", () => { if (!$("pad").classList.contains("hide")) sizePad(); });

// --- 送信 ---
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  const name = $("name").value.trim();
  if (!name) return ($("err").textContent = "お名前を入れてください");
  if (!$("address").value.trim()) return ($("err").textContent = "ご住所を入れてください");
  if (!sigImage) return ($("err").textContent = "サインを書いてください(「タップしてサインを書く」を押します)");
  $("send").disabled = true; $("send").textContent = "送信中…";
  try {
    const img = window.drawReceipt({ ...receipt, name, address: $("address").value.trim(), phone: $("phone").value.trim() }, sigImage);
    const png = img.toDataURL("image/png").split(",")[1];
    const res = await api("POST", "/api/sign", { t: token, name, address: $("address").value.trim(), phone: $("phone").value.trim(), png });
    $("copy").href = res.copyUrl;
    show("done");
  } catch (err) {
    $("err").textContent = err.message;
    $("send").disabled = false; $("send").textContent = "この内容で送信する";
  }
});

(async () => {
  if (!token) return fail("URL が正しくありません。送ってくれた人に連絡してください。");
  try {
    receipt = (await api("GET", `/api/sign?t=${encodeURIComponent(token)}`)).receipt;
  } catch (err) { return fail(err.message); }
  $("payee").textContent = `${receipt.payee}　様`;
  $("date").textContent = receipt.dateJp;
  $("amount").textContent = `¥ ${receipt.amount.toLocaleString("ja-JP")} −`;
  $("prov").textContent = receipt.proviso;
  $("address").value = receipt.address; $("name").value = receipt.name; $("phone").value = receipt.phone;
  show("form");
})();
</script>
</body>
</html>
